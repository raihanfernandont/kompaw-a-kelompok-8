version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: perpus_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - perpus-network

  backend:
    build: ./backend
    container_name: perpus_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
    depends_on:
      - db
    networks:
      - perpus-network

  frontend:
    build: ./frontend
    container_name: perpus_frontend
    restart: unless-stopped
    networks:
      - perpus-network

  nginx:
    image: nginx:alpine
    container_name: perpus_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - perpus-network

volumes:
  db_data:

networks:
  perpus-network:
    driver: bridge